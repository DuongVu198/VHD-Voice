<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15382f">
  <title>VHD Voice · Nhập liệu hiện trường</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./field.css?v=2.3">
  <script type="module" src="./unified.mjs?v=2.3"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell">VHD Voice · Kiểm kê GPMB</div>
  </header>
  <main class="shell">
    <h1>Nhập liệu hiện trường</h1>
    <section class="panel household" aria-label="Hồ sơ hộ">
      <div id="household-picker">
        <label id="saved-households-label">Chọn hồ sơ hộ<select id="saved-households"></select></label>
        <p id="no-households" hidden>Chưa có hồ sơ trong danh sách.</p>
      </div>
      <div id="new-household-fields">
      <label>Tên hộ
        <input id="household-name" autocomplete="name" placeholder="Nhập tên hộ để bắt đầu">
      </label>
      </div>
      <div class="form-actions">
        <button type="button" class="primary" id="new-household">Bắt đầu hồ sơ</button>
        <button type="button" class="secondary" id="open-file">Mở file đã lưu</button>
        <button type="button" class="secondary" id="backup-all" hidden>Sao lưu toàn bộ</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden>
      </div>
      <details id="trash" hidden>
        <summary>Hồ sơ đã xóa</summary>
        <ul id="trash-list"></ul>
      </details>
      <div id="session-controls" hidden>
        <p id="active-household"></p>
        <p id="backup-status" role="status"></p>
        <div class="form-actions">
          <button type="button" class="secondary" id="update-file">Cập nhật file</button>
          <button type="button" class="text-button" id="close-household">Đóng hồ sơ</button>
          <button type="button" class="text-button danger-text" id="trash-household">Xóa hồ sơ</button>
        </div>
      </div>
    </section>
    <p id="status" class="status" role="status" hidden></p>
    <div class="columns" id="workspace" hidden>
      <section class="panel" aria-label="Nhập tài sản">
        <div class="choices" role="group" aria-label="Loại tài sản">
          <button type="button" data-mode="house" aria-pressed="true">Nhà/Công trình</button>
          <button type="button" data-mode="tree" aria-pressed="false">Cây</button>
        </div>
        <form id="asset-form" novalidate>
          <div class="voice">
            <div class="voice-actions">
              <button type="button" class="secondary" id="stop" hidden>Dừng mic</button>
              <button type="button" class="secondary" id="keyboard-dictation" aria-pressed="false">Bàn phím iPhone</button>
            </div>
            <p id="guide" class="guide"></p>

          </div>
          <div class="fields">
            <label>Tiêu đề
              <input id="title" autocomplete="off" placeholder="Nếu có">
            </label>
            <label><span id="name-label">Tên tài sản</span>
              <input id="name" autocomplete="off">
            </label>
            <label id="spec-field">Thông số kỹ thuật
              <textarea id="spec" rows="2" inputmode="none" autocomplete="off" aria-describedby="spec-preview"></textarea>
            </label>
            <p id="spec-preview" class="status">Phép tính: —</p>
            <div class="measurements" id="tree-fields" hidden>
              <label>Đường kính <span class="unit">(cm)</span>
                <input id="diameter" inputmode="none" autocomplete="off" placeholder="Nếu có">
              </label>
              <label>Chiều cao <span class="unit">(m)</span>
                <input id="height" inputmode="none" autocomplete="off" placeholder="Nếu có">
              </label>
              <label>Số lượng <span class="unit">(cây)</span>
                <input id="quantity" inputmode="none" autocomplete="off">
              </label>
            </div>
            <div id="math-keys" role="group" aria-label="Bàn phím số" hidden>
              <div class="math-keys">
                <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="backspace" aria-label="Xóa ký tự">xóa</button><button type="button" data-key="clear" aria-label="Xóa nội dung ô">AC</button>
                <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="x">x</button><button type="button" data-key="/">/</button>
                <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="+">+</button><button type="button" data-key="-">-</button>
                <button type="button" data-key="0">0</button><button type="button" data-key=",">,</button><button type="button" data-key="(">(</button><button type="button" data-key=")">)</button>
              </div>
              <button type="button" class="text-button" id="number-dictation">Bàn phím iPhone</button>
            </div>
            <div class="form-actions">
              <button type="submit" class="secondary" id="save">Lưu</button>
              <button type="button" class="text-button" id="cancel" disabled>Xóa nhập</button>
            </div>
          </div>
        </form>
      </section>
      <section class="panel saved" aria-labelledby="saved-title">
        <div class="saved-heading">
          <h2 id="saved-title">Tài sản đã lưu</h2>
          <span id="count" class="count" aria-label="Số tài sản đã lưu">0</span>
        </div>
        <p id="empty" class="empty">Chưa có tài sản nào.</p>
        <ul id="assets"></ul>
        <p class="storage-note">Dữ liệu lưu trong trình duyệt này.</p>
      </section>
    </div>
  </main>
  <dialog id="household-confirm" aria-labelledby="confirm-message">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="form-actions">
        <button class="secondary" value="no" autofocus>Không</button>
        <button class="primary" value="yes">Có</button>
      </div>
    </form>
  </dialog>
  <dialog id="device-keyboard" aria-labelledby="device-keyboard-title">
    <form method="dialog">
      <label id="device-keyboard-title" for="device-keyboard-input"></label>
      <textarea id="device-keyboard-input" rows="3" inputmode="text" autocomplete="off" autofocus></textarea>
      <div class="form-actions">
        <button class="secondary" value="cancel">Hủy</button>
        <button class="primary" value="apply">Dùng nội dung</button>
      </div>
    </form>
  </dialog>
</body>
</html>
